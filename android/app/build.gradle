apply plugin: 'com.android.application'

// Never commit keys/passwords. Set all four variables together for signing.
def releaseValues = ['CW_KEYSTORE_PATH', 'CW_KEYSTORE_PASSWORD', 'CW_KEY_ALIAS', 'CW_KEY_PASSWORD']
    .collectEntries { key -> [(key): System.getenv(key)] }
def signingReady = releaseValues.values().every { it != null && !it.isEmpty() }
def signingPartial = releaseValues.values().any { it != null && !it.isEmpty() }
if (signingPartial && !signingReady) {
    throw new GradleException('Incomplete CW release signing environment; provide all four variables.')
}
if (project.hasProperty('cwRequireSigning') && !signingReady) {
    throw new GradleException('Release signing required: configure CW_KEYSTORE_PATH, CW_KEYSTORE_PASSWORD, CW_KEY_ALIAS and CW_KEY_PASSWORD.')
}

android {
    namespace 'com.cw.incentive'
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId 'com.cw.incentive'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // v1.2 release metadata; application identity remains unchanged.
        versionCode 2
        versionName '1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(releaseValues.CW_KEYSTORE_PATH)
                storePassword releaseValues.CW_KEYSTORE_PASSWORD
                keyAlias releaseValues.CW_KEY_ALIAS
                keyPassword releaseValues.CW_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingReady) signingConfig signingConfigs.release
        }
    }
}
repositories {
    flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs' }
}
dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation 'androidx.test:core:1.6.1'
}
apply from: 'capacitor.build.gradle'
if (!signingReady) {
    logger.lifecycle('CW Phase 2: release APK/AAB will be UNSIGNED (build verification only).')
}
